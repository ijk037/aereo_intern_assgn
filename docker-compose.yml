services:
  geospatial-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial_measurement_api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - APP_NAME=Geospatial Measurement API
      - DATABASE_URL=sqlite:///./geospatial.db
    volumes:
      - ./uploads:/app/uploads
      - ./geospatial.db:/app/geospatial.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
